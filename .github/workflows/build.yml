name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Copy custom app icons (if present)
        run: |
          if [ -d "custom-icons" ]; then
            for dir in mdpi hdpi xhdpi xxhdpi; do
              if [ -d "custom-icons/mipmap-$dir" ]; then
                cp custom-icons/mipmap-$dir/*.png android/app/src/main/res/mipmap-$dir/
              fi
            done
          else
            echo "No custom-icons folder found, skipping (using default icon)"
          fi

      - name: Copy custom splash screens (if present)
        run: |
          if [ -d "custom-splash" ]; then
            mkdir -p android/app/src/main/res/drawable-port-mdpi android/app/src/main/res/drawable-port-hdpi android/app/src/main/res/drawable-port-xhdpi android/app/src/main/res/drawable-port-xxhdpi android/app/src/main/res/drawable-land-mdpi android/app/src/main/res/drawable-land-hdpi android/app/src/main/res/drawable-land-xhdpi android/app/src/main/res/drawable-land-xxhdpi
            [ -f custom-splash/drawable-port-mdpi.png ] && cp custom-splash/drawable-port-mdpi.png android/app/src/main/res/drawable-port-mdpi/splash.png
            [ -f custom-splash/drawable-port-hdpi.png ] && cp custom-splash/drawable-port-hdpi.png android/app/src/main/res/drawable-port-hdpi/splash.png
            [ -f custom-splash/drawable-port-xhdpi.png ] && cp custom-splash/drawable-port-xhdpi.png android/app/src/main/res/drawable-port-xhdpi/splash.png
            [ -f custom-splash/drawable-port-xxhdpi.png ] && cp custom-splash/drawable-port-xxhdpi.png android/app/src/main/res/drawable-port-xxhdpi/splash.png
            [ -f custom-splash/drawable-land-mdpi.png ] && cp custom-splash/drawable-land-mdpi.png android/app/src/main/res/drawable-land-mdpi/splash.png
            [ -f custom-splash/drawable-land-hdpi.png ] && cp custom-splash/drawable-land-hdpi.png android/app/src/main/res/drawable-land-hdpi/splash.png
            [ -f custom-splash/drawable-land-xhdpi.png ] && cp custom-splash/drawable-land-xhdpi.png android/app/src/main/res/drawable-land-xhdpi/splash.png
            [ -f custom-splash/drawable-land-xdpi.png ] && cp custom-splash/drawable-land-xdpi.png android/app/src/main/res/drawable-land-xhdpi/splash.png
            [ -f custom-splash/drawable-land-xxhdpi.png ] && cp custom-splash/drawable-land-xxhdpi.png android/app/src/main/res/drawable-land-xxhdpi/splash.png
            [ -f custom-splash/drawable-port-xxhdpi.png ] && cp custom-splash/drawable-port-xxhdpi.png android/app/src/main/res/drawable/splash.png
          else
            echo "No custom-splash folder found, skipping (using default splash)"
          fi

      - name: Ensure assets folder exists
        run: mkdir -p android/app/src/main/assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sally-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
